<style>
  .grafica { --gf-linea:#c98a00; --gf-relleno:rgba(255,192,0,.18); --gf-texto:#666; --gf-grid:#e8e8e8; --gf-punto:#111; width:100%; }
  .tema-oscuro .grafica { --gf-linea:#FFC000; --gf-relleno:rgba(255,192,0,.14); --gf-texto:#9a9a9a; --gf-grid:#2c2c2c; --gf-punto:#fff; }
  .grafica svg { width:100%; height:auto; display:block; overflow:visible; }
  .grafica .gf-vacio { color:var(--gf-texto); font-size:13px; padding:24px 6px; text-align:center; }
</style>
<script>
/* Gráfica de línea en SVG, sin librerías.
 * puntos: [{x:'yyyy-mm-dd', y:Number}]  (varios en la misma fecha -> se toma el último)
 * opts: { unidad:'kg', decimales:1, alto:220, vacio:'texto si no hay datos' } */
function graficaLinea(el, puntos, opts) {
  opts = opts || {};
  var dec = opts.decimales == null ? 1 : opts.decimales;
  var unidad = opts.unidad ? ' ' + opts.unidad : '';
  var porFecha = {};
  (puntos || []).forEach(function (p) { if (p && p.x && isFinite(p.y)) porFecha[p.x] = Number(p.y); });
  var pts = Object.keys(porFecha).sort().map(function (k) { return { x: k, y: porFecha[k] }; });
  el.classList.add('grafica');
  if (!pts.length) { el.innerHTML = '<div class="gf-vacio">' + (opts.vacio || 'Aún no hay datos') + '</div>'; return; }

  var W = 600, Hh = opts.alto || 220, L = 46, R = 18, T = 20, B = 30;
  var t = function (iso) { var a = iso.split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]); };
  var x0 = t(pts[0].x), x1 = t(pts[pts.length - 1].x);
  var ys = pts.map(function (p) { return p.y; });
  var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
  if (ymax - ymin < 1e-9) { ymin -= 1; ymax += 1; }
  var pad = (ymax - ymin) * 0.15; ymin -= pad; ymax += pad;
  var X = function (iso) { return x1 === x0 ? (L + (W - L - R) / 2) : L + (t(iso) - x0) / (x1 - x0) * (W - L - R); };
  var Y = function (v) { return T + (ymax - v) / (ymax - ymin) * (Hh - T - B); };
  var fmt = function (v) { return Number(v).toFixed(dec).replace('.', ','); };
  var dm = function (iso) { var a = iso.split('-'); return a[2] + '/' + a[1]; };

  var s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + (opts.titulo || 'Progreso') + '">';
  for (var i = 0; i <= 4; i++) {
    var v = ymin + (ymax - ymin) * i / 4, yy = Y(v);
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" style="stroke:var(--gf-grid)" stroke-width="1"/>';
    s += '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" style="fill:var(--gf-texto)">' + fmt(v) + '</text>';
  }
  var etiquetas = pts.length <= 2 ? pts : [pts[0], pts[Math.floor((pts.length - 1) / 2)], pts[pts.length - 1]];
  etiquetas.forEach(function (p, k) {
    var anc = pts.length === 1 ? 'middle' : (k === 0 ? 'start' : (k === etiquetas.length - 1 ? 'end' : 'middle'));
    s += '<text x="' + X(p.x) + '" y="' + (Hh - 8) + '" text-anchor="' + anc + '" font-size="11" style="fill:var(--gf-texto)">' + dm(p.x) + '</text>';
  });
  var linea = pts.map(function (p, k) { return (k ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
  if (pts.length > 1) {
    var base = (Hh - B).toFixed(1);
    s += '<path d="' + linea + ' L' + X(pts[pts.length - 1].x).toFixed(1) + ' ' + base + ' L' + X(pts[0].x).toFixed(1) + ' ' + base + ' Z" style="fill:var(--gf-relleno)" stroke="none"/>';
    s += '<path d="' + linea + '" fill="none" style="stroke:var(--gf-linea)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function (p, k) {
    var ult = k === pts.length - 1;
    s += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + (ult ? 6 : 4) + '" style="fill:' + (ult ? 'var(--gf-linea)' : 'var(--gf-punto)') + ';stroke:var(--gf-linea)" stroke-width="2"><title>' + dm(p.x) + ': ' + fmt(p.y) + unidad + '</title></circle>';
  });
  var u = pts[pts.length - 1], ux = X(u.x);
  var cerca = ux > W - 60;
  s += '<text x="' + (cerca ? ux - 10 : ux) + '" y="' + (Y(u.y) - 14) + '" text-anchor="' + (cerca ? 'end' : 'middle') + '" font-size="13" font-weight="800" style="fill:var(--gf-linea)">' + fmt(u.y) + unidad + '</text>';
  el.innerHTML = s + '</svg>';
}
</script>
