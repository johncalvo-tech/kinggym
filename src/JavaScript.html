<script>
/* =====================================================================
 *  GYM MANAGER — Cliente
 * ===================================================================== */
var S = {
  token: '', user: null, cfg: {}, planes: [], medios: [], productos: [], miembros: [],
  tab: 'panel', facePromise: null, matcher: null, nombres: {}, escaneando: false, tFacial: null,
  fotoNueva: '', descNuevo: null, audio: null,
  rutinas: [], rutinasFull: [], filas: [], urlSocio: '', miembroActual: null
};
var FACE_JS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
var FACE_MODELOS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';

/* ---------- utilidades ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function cop(n) { return '$ ' + Math.round(Number(n) || 0).toLocaleString('es-CO'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fFecha(iso) { if (!iso) return ''; var p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function isoDe(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hoyISO() { return isoDe(new Date()); }
function mesActual() { return hoyISO().slice(0, 7); }
function sumarDiaISO(iso, n) { var p = iso.split('-').map(Number); return isoDe(new Date(p[0], p[1] - 1, p[2] + n)); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function esAdmin() { return !!(S.user && String(S.user.rol).toUpperCase() === 'ADMIN'); }
function cargando(on) { $('loader').classList.toggle('hidden', !on); }
function toast(msg, tipo) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (tipo || '');
  clearTimeout(t._t); t._t = setTimeout(function () { t.className = 'toast'; }, 4000);
}
function diasTxt(d) { return d == null ? '—' : (d < 0 ? 'Vencida hace ' + Math.abs(d) + ' d' : d + ' Días'); }

/* ---------- llamadas al servidor ---------- */
function llamar(fn, args, conToken) {
  return GymAPI.call(fn, conToken ? [S.token].concat(args) : args).catch(function (e) {
    var m = e.message;
    if (m.indexOf('SESION_EXPIRADA') >= 0) { salir(); m = 'La sesión expiró. Ingrese de nuevo.'; }
    throw new Error(m);
  });
}
function api(fn) { return llamar(fn, [].slice.call(arguments, 1), true); }
// Muestra loader; ante error muestra toast y devuelve undefined
async function conCarga(promesa) {
  cargando(true);
  try { return await promesa; }
  catch (e) { toast(e.message, 'err'); return undefined; }
  finally { cargando(false); }
}

/* ---------- inicio / sesión ---------- */
window.addEventListener('load', async function () {
  document.querySelectorAll('#tabs button').forEach(function (b) { b.onclick = function () { mostrarTab(b.dataset.tab); }; });
  $('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  $('inCodigo').addEventListener('keydown', function (e) { if (e.key === 'Enter') ingresoManual(); });
  try {
    var info = await llamar('infoLogin', [], false);
    $('lgGym').textContent = info.gym;
    try { $('lgUser').value = localStorage.getItem('gymUsuario') || ''; } catch (e) { }
    $('lgUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('lgPin').focus(); });
  } catch (e) { toast(e.message, 'err'); }
  var guardado = '';
  try { guardado = sessionStorage.getItem('gymToken') || ''; } catch (e) { }
  if (guardado) { S.token = guardado; try { await iniciarApp(); } catch (e) { S.token = ''; } }
});

async function entrar() {
  var usuario = $('lgUser').value.trim(), pin = $('lgPin').value.trim();
  if (!usuario || !pin) return toast('Escriba su usuario y su PIN', 'err');
  var r = await conCarga(llamar('login', [usuario, pin], false));
  if (!r) return;
  try { localStorage.setItem('gymUsuario', usuario); } catch (e) { }
  S.token = r.token;
  S.pinActual = r.debeCambiar ? pin : '';
  try { sessionStorage.setItem('gymToken', r.token); } catch (e) { }
  $('lgPin').value = '';
  cargando(true);
  try { await iniciarApp(); } catch (e) { toast(e.message, 'err'); } finally { cargando(false); }
  if (r.debeCambiar) { $('stPin1').value = ''; $('stPin2').value = ''; $('mPinStaff').classList.remove('hidden'); $('stPin1').focus(); }
}

async function guardarPinStaff() {
  var a = $('stPin1').value.trim(), b = $('stPin2').value.trim();
  if (!/^\d{6}$/.test(a)) return toast('El PIN debe tener 6 números', 'err');
  if (a !== b) return toast('Los PIN no coinciden', 'err');
  var ok = await conCarga(api('cambiarPinUsuario', S.pinActual, a));
  if (!ok) return;
  S.pinActual = '';
  $('mPinStaff').classList.add('hidden');
  toast('PIN actualizado ✓', 'ok');
}

async function iniciarApp() {
  var d = await api('datosIniciales');
  S.user = d.usuario; S.cfg = d.cfg; S.planes = d.planes; S.medios = d.medios;
  S.rutinas = d.rutinas || []; S.urlSocio = d.urlSocio || '';
  if (!GymAPI.enGoogle) S.urlSocio = new URL('socio.html', location.href).href;
  $('hdGym').textContent = S.cfg.GYM_NOMBRE;
  $('hdTel').textContent = S.cfg.GYM_TELEFONO;
  $('hdNequi').textContent = S.cfg.NEQUI ? 'NEQUI ' + S.cfg.NEQUI : '';
  $('hdUser').textContent = '👤 ' + S.user.nombre;
  document.body.classList.toggle('es-admin', esAdmin());
  document.body.classList.toggle('es-coach', esAdmin() || String(S.user.rol).toUpperCase() === 'ENTRENADOR');
  llenarSelects();
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  mostrarTab('panel');
}

function salir() {
  detenerFacial(); Cam.cerrar();
  if (S.token) { var t = S.token; GymAPI.call('logout', [t]).catch(function () { }); }
  S.token = ''; S.user = null;
  try { sessionStorage.removeItem('gymToken'); } catch (e) { }
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

function mostrarTab(t) {
  if (S.tab !== t) { detenerFacial(); Cam.cerrar(); }
  S.tab = t;
  document.querySelectorAll('.tab').forEach(function (s) { s.classList.add('hidden'); });
  $('tab-' + t).classList.remove('hidden');
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
  if (t === 'panel') cargarPanel();
  if (t === 'ingreso') setTimeout(function () { $('inCodigo').focus(); }, 50);
  if (t === 'miembros') cargarMiembros();
  if (t === 'pagos') { if (!$('pMes').value) $('pMes').value = mesActual(); cargarPagosMes(); }
  if (t === 'tienda') cargarTienda();
  if (t === 'rutinas') cargarRutinas();
  if (t === 'informes' && !$('iMes').value) $('iMes').value = mesActual();
}

function llenarSelects() {
  $('pPlan').innerHTML = S.planes.map(function (p) { return '<option value="' + esc(p.plan) + '">' + esc(p.plan) + ' — ' + cop(p.valor) + '</option>'; }).join('');
  var med = S.medios.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('');
  $('pMedio').innerHTML = med; $('vMedio').innerHTML = med;
  $('pInicio').value = hoyISO();
  pPlanCambio();
  llenarSelectRutinas();
}

function llenarSelectRutinas() {
  var v = $('mRutina').value;
  $('mRutina').innerHTML = '<option value="">— Sin rutina —</option>' +
    S.rutinas.map(function (r) { return '<option value="' + esc(r.id) + '">' + esc(r.nombre) + '</option>'; }).join('');
  $('mRutina').value = v;
}

/* ---------- helpers de render ---------- */
function kpi(t, v, s) { return '<div class="kpi"><div class="kpi-t">' + esc(t) + '</div><div class="kpi-v">' + esc(v) + '</div>' + (s ? '<div class="kpi-s">' + esc(s) + '</div>' : '') + '</div>'; }
function lista(items, fn, vacio) { return items.length ? '<ul class="lista">' + items.map(fn).join('') + '</ul>' : '<p class="muted">' + esc(vacio || 'Sin registros') + '</p>'; }
function fila(k, v) { return '<tr><th>' + esc(k) + '</th><td>' + esc(v == null ? '' : v) + '</td></tr>'; }
function wa(tel, msg) {
  tel = String(tel || '').replace(/\D/g, '');
  if (!tel) return '';
  if (tel.length === 10) tel = '57' + tel;
  return '<a class="wa" target="_blank" href="https://wa.me/' + tel + '?text=' + encodeURIComponent(msg) + '">WhatsApp</a>';
}
function msgVence(x) { return 'Hola ' + x.nombre.split(' ')[0] + ', te recordamos que tu mensualidad en ' + S.cfg.GYM_NOMBRE + ' vence el ' + fFecha(x.fin) + '. ¡Te esperamos para renovar! 💪' + (S.cfg.NEQUI ? ' Nequi: ' + S.cfg.NEQUI : ''); }
function msgVencido(x) { return 'Hola ' + x.nombre.split(' ')[0] + ', tu mensualidad en ' + S.cfg.GYM_NOMBRE + ' venció el ' + fFecha(x.fin) + '. ¡Te extrañamos! Renueva y sigue entrenando 💪' + (S.cfg.NEQUI ? ' Nequi: ' + S.cfg.NEQUI : ''); }
function msgCumple(x) { return '¡Feliz cumpleaños ' + x.nombre.split(' ')[0] + '! 🎉 Todo el equipo de ' + S.cfg.GYM_NOMBRE + ' te desea un gran día. 💪'; }

/* =====================================================================
 *  INICIO
 * ===================================================================== */
async function cargarPanel() {
  var p = await conCarga(api('panel'));
  if (!p) return;
  $('pnKpis').innerHTML =
    kpi('Miembros activos', p.activos, 'de ' + p.totalMiembros + ' registrados') +
    kpi('Ingresos hoy', p.ingresosHoy) +
    kpi('Recaudo hoy', cop(p.recaudoMembresias + p.recaudoVentas), 'Membresías ' + cop(p.recaudoMembresias) + ' · Tienda ' + cop(p.recaudoVentas)) +
    kpi('Por vencer', p.porVencer.length, 'próximos ' + p.diasAlerta + ' días');

  $('pnCumple').innerHTML =
    lista(p.cumpleHoy, function (x) { return '<li><span>🎂 <b>' + esc(x.nombre) + '</b> cumple ' + x.edad + ' HOY</span>' + wa(x.telefono, msgCumple(x)) + '</li>'; }, 'Nadie cumple años hoy') +
    (p.cumpleProx.length ? '<p class="muted">Próximos 7 días</p>' + lista(p.cumpleProx, function (x) { return '<li><span>' + esc(x.nombre) + ' — ' + fFecha(x.fecha) + ' (' + x.edad + ')</span><span class="muted">en ' + x.dias + ' d</span></li>'; }) : '');

  $('pnVencer').innerHTML = lista(p.porVencer, function (x) {
    return '<li><span><b>' + esc(x.nombre) + '</b><br><span class="muted">vence ' + fFecha(x.fin) + '</span></span><span><span class="dias ' + (x.dias <= p.diasAlerta ? 'rojo' : 'amarillo') + '">' + x.dias + ' d</span> ' + wa(x.telefono, msgVence(x)) + '</span></li>';
  }, 'Nadie próximo a vencer');

  $('pnVencidos').innerHTML = lista(p.vencidos, function (x) {
    return '<li><span><b>' + esc(x.nombre) + '</b><br><span class="muted">venció ' + fFecha(x.fin) + '</span></span><span>' + wa(x.telefono, msgVencido(x)) + '</span></li>';
  }, 'Sin vencidos recientes');

  $('pnAsis').innerHTML = p.asistencias.length
    ? '<table class="tabla"><thead><tr><th>Hora</th><th>Nombre</th><th>Método</th><th>Estado</th></tr></thead><tbody>' +
      p.asistencias.map(function (a) { return '<tr><td>' + esc(a.hora) + '</td><td>' + esc(a.nombre) + '</td><td>' + esc(a.metodo) + '</td><td>' + esc(a.estado) + '</td></tr>'; }).join('') + '</tbody></table>'
    : '<p class="muted">Aún no hay ingresos hoy</p>';
}

/* =====================================================================
 *  INGRESO
 * ===================================================================== */
async function ingresoManual() {
  var c = $('inCodigo').value.trim();
  if (!c) return;
  $('inCodigo').value = '';
  await ingresar(c, 'MANUAL');
  $('inCodigo').focus();
}

async function ingresar(codigo, metodo) {
  var r = await conCarga(api('registrarIngreso', codigo, metodo));
  if (!r) return;
  if (!r.ok) { $('inFicha').innerHTML = '<div class="alerta rojo">' + esc(r.msg) + '</div>'; sonido(false); return; }
  mostrarFicha(r.ficha, $('inFicha'), r.aviso);
  sonido(r.ficha.estado === 'ACTIVA');
}

function mostrarFicha(f, el, aviso) {
  var ok = f.estado === 'ACTIVA';
  var banner = ok ? '<div class="banner verde">✅ ACCESO PERMITIDO</div>'
    : f.estado === 'VENCIDA' ? '<div class="banner rojo">⛔ MEMBRESÍA VENCIDA</div>'
    : f.estado === 'PROGRAMADA' ? '<div class="banner gris">🕒 SU PLAN INICIA EL ' + fFecha(f.fechaIngreso) + '</div>'
    : '<div class="banner rojo">⛔ SIN PLAN ACTIVO</div>';
  el.innerHTML = banner +
    (aviso ? '<div class="alerta amarillo">' + esc(aviso) + '</div>' : '') +
    (f.cumpleHoy ? '<div class="banner cumple">🎂 ¡FELIZ CUMPLEAÑOS, ' + esc(f.nombre.split(' ')[0].toUpperCase()) + '!</div>' : '') +
    '<div class="ficha"><div class="ficha-foto">' + (f.foto ? '<img src="' + f.foto + '" alt="">' : '<div class="sin-foto">👤</div>') + '</div>' +
    '<div class="ficha-datos"><div class="ficha-nombre">' + esc(f.nombre) + '</div>' +
    '<div class="muted">CC ' + esc(f.cedula) + (f.edad !== '' ? ' · ' + f.edad + ' años' : '') + '</div>' +
    '<table class="mini">' + fila('Plan', f.plan) + fila('Fecha ingreso', fFecha(f.fechaIngreso)) + fila('Fecha terminación', fFecha(f.fechaTerminacion)) +
    '<tr><th>Días</th><td><span class="dias ' + f.color + '">' + esc(diasTxt(f.dias)) + '</span></td></tr>' +
    fila('Posición', f.posicion) + fila('Vendedor', f.vendedor) + fila('Comentarios', f.comentarios || f.comentarioPago) + '</table></div></div>' +
    (!ok ? '<button class="btn btn-yellow" onclick="irAPago(\'' + esc(f.cedula) + '\')">💵 Renovar ahora</button>' : '');
}

function sonido(ok) {
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    var ctx = S.audio || (S.audio = new C());
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = ok ? 880 : 220; g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + (ok ? 0.15 : 0.6));
  } catch (e) { }
}

/* =====================================================================
 *  CÁMARA
 * ===================================================================== */
var Cam = {
  stream: null,
  abrir: async function (video) {
    Cam.cerrar();
    try {
      Cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      video.srcObject = Cam.stream;
      await video.play();
      return true;
    } catch (e) { console.warn('Cámara:', e); Cam.stream = null; return false; }
  },
  cerrar: function () {
    if (Cam.stream) { Cam.stream.getTracks().forEach(function (t) { t.stop(); }); Cam.stream = null; }
  },
  capturar: function (video, max) {
    var w = video.videoWidth, h = video.videoHeight, k = Math.min(1, (max || 480) / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    return c;
  }
};

function archivoACanvas(file, max) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, (max || 480) / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c);
    };
    img.onerror = function () { rej(new Error('No se pudo leer la imagen')); };
    img.src = URL.createObjectURL(file);
  });
}

/* =====================================================================
 *  RECONOCIMIENTO FACIAL (face-api.js, corre en el navegador)
 * ===================================================================== */
function cargarFaceApi() {
  if (S.facePromise) return S.facePromise;
  S.facePromise = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = FACE_JS;
    s.onload = async function () {
      try {
        try { await faceapi.tf.ready(); } catch (e) { }
        await faceapi.nets.tinyFaceDetector.load(FACE_MODELOS);
        await faceapi.nets.faceLandmark68Net.load(FACE_MODELOS);
        await faceapi.nets.faceRecognitionNet.load(FACE_MODELOS);
        res(true);
      } catch (e) { rej(new Error('No se pudieron cargar los modelos faciales: ' + e.message)); }
    };
    s.onerror = function () { rej(new Error('No se pudo cargar la librería de reconocimiento facial (revise internet)')); };
    document.head.appendChild(s);
  });
  S.facePromise.catch(function () { S.facePromise = null; });
  return S.facePromise;
}

function opcionesDetector() { return new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 }); }

async function descriptorDe(canvas) {
  await cargarFaceApi();
  var det = await faceapi.detectSingleFace(canvas, opcionesDetector()).withFaceLandmarks().withFaceDescriptor();
  return det ? Array.from(det.descriptor) : null;
}

async function prepararMatcher() {
  var listaD = await api('getDescriptores');
  await cargarFaceApi();
  S.nombres = {};
  if (!listaD.length) { S.matcher = null; return 0; }
  var etiquetados = listaD.map(function (x) {
    S.nombres[x.c] = x.n;
    return new faceapi.LabeledFaceDescriptors(x.c, [new Float32Array(x.d)]);
  });
  S.matcher = new faceapi.FaceMatcher(etiquetados, Number(S.cfg.UMBRAL_FACIAL) || 0.5);
  return listaD.length;
}

async function reconocer(canvas) {
  var det = await faceapi.detectSingleFace(canvas, opcionesDetector()).withFaceLandmarks().withFaceDescriptor();
  if (!det) { $('inFaceMsg').textContent = 'Buscando rostro…'; return null; }
  var best = S.matcher.findBestMatch(det.descriptor);
  if (best.label === 'unknown') { $('inFaceMsg').textContent = '❓ Rostro no reconocido'; return null; }
  return best;
}

function toggleFacial() { if (S.escaneando || Cam.stream) detenerFacial(); else iniciarFacial(); }

async function iniciarFacial() {
  clearTimeout(S.tFacial);
  var msg = $('inFaceMsg');
  msg.textContent = 'Abriendo cámara…';
  var ok = await Cam.abrir($('inVideo'));
  if (!ok) { msg.textContent = 'No se pudo abrir la cámara. Use el botón "Foto".'; return; }
  $('btnFacial').textContent = '⏹️ Detener';
  msg.textContent = 'Cargando reconocimiento facial…';
  try {
    var n = await prepararMatcher();
    if (!n) { msg.textContent = 'No hay rostros registrados (regístrelos en Miembros).'; return; }
  } catch (e) { msg.textContent = e.message; return; }
  if (!Cam.stream) return;
  S.escaneando = true;
  msg.textContent = 'Buscando rostro… (' + n + ' registrados)';
  bucleFacial();
}

function detenerFacial() {
  S.escaneando = false;
  clearTimeout(S.tFacial);
  Cam.cerrar();
  if ($('btnFacial')) $('btnFacial').textContent = '📷 Iniciar reconocimiento';
  if ($('inFaceMsg')) $('inFaceMsg').textContent = 'Cámara apagada';
}

async function bucleFacial() {
  if (!S.escaneando) return;
  var v = $('inVideo');
  try {
    if (v.readyState >= 2 && v.videoWidth) {
      var r = await reconocer(Cam.capturar(v, 480));
      if (r && S.escaneando) {
        S.escaneando = false;
        $('inFaceMsg').textContent = '✅ ' + (S.nombres[r.label] || r.label) + ' (' + Math.round((1 - r.distance) * 100) + '%)';
        await ingresar(r.label, 'FACIAL');
        S.tFacial = setTimeout(function () {
          if (Cam.stream && S.tab === 'ingreso') { S.escaneando = true; $('inFaceMsg').textContent = 'Buscando rostro…'; bucleFacial(); }
        }, 5000);
        return;
      }
    }
  } catch (e) { console.warn(e); }
  S.tFacial = setTimeout(bucleFacial, 600);
}

async function facialDesdeArchivo(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  cargando(true);
  try {
    var c = await archivoACanvas(file, 480);
    if (!S.matcher) {
      var n = await prepararMatcher();
      if (!n) { toast('No hay rostros registrados todavía', 'err'); return; }
    }
    var r = await reconocer(c);
    if (!r) { toast('No se reconoció a la persona. Intente de nuevo o use la cédula.', 'err'); sonido(false); return; }
    cargando(false);
    await ingresar(r.label, 'FACIAL');
  } catch (e) { toast(e.message, 'err'); } finally { cargando(false); }
}

/* =====================================================================
 *  MIEMBROS
 * ===================================================================== */
async function cargarMiembros() {
  var l = await conCarga(api('listarMiembros'));
  if (!l) return;
  S.miembros = l;
  filtrarMiembros();
}

function filtrarMiembros() {
  var q = norm($('mBuscar').value);
  var l = S.miembros.filter(function (m) { return !q || norm(m.nombre).indexOf(q) >= 0 || m.cedula.indexOf(q) >= 0; });
  $('mCount').textContent = '(' + l.length + ')';
  $('mTabla').innerHTML = '<thead><tr><th>Cédula</th><th>Nombre</th><th>Edad</th><th>Teléfono</th><th>Vence</th><th>Días</th><th title="Rostro">😀</th><th title="Huella">☝️</th></tr></thead><tbody>' +
    l.slice(0, 400).map(function (m) {
      return '<tr onclick="cargarMiembro(\'' + m.cedula + '\')"><td>' + esc(m.cedula) + '</td><td>' + esc(m.nombre) + '</td><td>' + esc(m.edad) + '</td><td>' + esc(m.telefono) +

 * ===================================================================== */
function planSel() { var v = $('pPlan').value; return S.planes.filter(function (p) { return p.plan === v; })[0]; }
function pPlanCambio() { var p = planSel(); if (p) $('pValor').value = p.valor; if (!$('pInicio').value) $('pInicio').value = hoyISO(); pCalcFin(); }

// Misma regla que el servidor: 01/09 + 1 mes => 30/09
function calcFin(iniIso, meses, dias) {
  var p = iniIso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  if (meses > 0) {
    var r = new Date(d.getFullYear(), d.getMonth() + meses, 1);
    var ult = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
    r.setDate(Math.min(d.getDate(), ult)); d = r;
  }
  if (dias > 0) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + dias);
  return isoDe(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1));
}
function pCalcFin() { var p = planSel(), i = $('pInicio').value; $('pFin').value = (p && i) ? calcFin(i, p.meses, p.dias) : ''; }

async function pBuscar() {
  var c = $('pCedula').value.trim();
  if (!c) return;
  var f;
  cargando(true);
  try { f = await api('buscarMiembro', c); } catch (e) { toast(e.message, 'err'); return; } finally { cargando(false); }
  if (!f) {
    $('pNombre').value = ''; $('pTel').value = ''; $('pFnac').value = '';
    $('pEstado').innerHTML = '<span class="badge amarillo">Persona nueva: se creará al registrar el pago</span>';
    $('pInicio').value = hoyISO(); pCalcFin(); $('pNombre').focus();
    return;
  }
  $('pNombre').value = f.nombre; $('pTel').value = f.telefono; $('pFnac').value = f.fechaNacimiento;
  $('pInicio').value = (f.fechaTerminacion && f.fechaTerminacion >= hoyISO()) ? sumarDiaISO(f.fechaTerminacion, 1) : hoyISO();
  if (f.plan && S.planes.some(function (p) { return p.plan === f.plan; })) { $('pPlan').value = f.plan; $('pValor').value = planSel().valor; }
  pCalcFin();
  $('pEstado').innerHTML = 'Estado actual: <span class="dias ' + f.color + '">' + esc(f.estado) + (f.fechaTerminacion ? ' · vence ' + fFecha(f.fechaTerminacion) : '') + '</span>' +
    (f.fechaNacimiento ? '' : ' <span class="badge amarillo">Falta fecha de nacimiento</span>');
}

    kpi('Por vencer', r.porVencer.length, 'próximos ' + r.diasAlerta + ' días') +
    kpi('Vencidos sin renovar', r.vencidosSinRenovar.length) +
    kpi('App de socios', r.app.sesiones + ' entrenos', r.app.socios + ' socios activos en la app · ' + r.app.medidas + ' pesajes') + '</div></div>';

  h += '<div class="grid2">' + tablaResumen('Por medio de pago (mensualidades + tienda)', r.porMedio) + tablaResumen('Mensualidades por vendedor', r.porVendedor) +
    tablaResumen('Mensualidades por plan', r.porPlan) + tablaResumen('Ventas por producto', r.ventasPorProducto) + '</div>';

  h += '<div class="card"><h3>Asistencias por día</h3><div class="barras">' + a.porDia.map(function (n, i) {
    return '<div class="barra" title="Día ' + (i + 1) + ': ' + n + '"><div style="height:' + (n / max * 100) + '%"></div><span>' + (i + 1) + '</span></div>';
  }).join('') + '</div></div>';

  h += '<div class="grid2">' +
    '<div class="card"><h3>⏳ Próximos a vencer (hoy en adelante)</h3>' + lista(r.porVencer, function (x) { return '<li><span><b>' + esc(x.nombre) + '</b> — ' + fFecha(x.fin) + ' <span class="dias rojo">' + x.dias + ' d</span></span>' + wa(x.telefono, msgVence(x)) + '</li>'; }, 'Nadie') + '</div>' +
    '<div class="card"><h3>❌ Vencieron en el mes y no renovaron</h3>' + lista(r.vencidosSinRenovar, function (x) { return '<li><span><b>' + esc(x.nombre) + '</b> — venció ' + fFecha(x.fin) + '</span>' + wa(x.telefono, msgVencido(x)) + '</li>'; }, 'Nadie') + '</div>' +
    '<div class="card"><h3>🎂 Cumpleaños del mes</h3>' + lista(r.cumpleanos, function (x) { return '<li><span><b>' + x.dia + '</b> — ' + esc(x.nombre) + ' (' + x.edad + ' años)</span>' + wa(x.telefono, msgCumple(x)) + '</li>'; }, 'Nadie cumple este mes (o faltan fechas de nacimiento)') + '</div>' +
    '<div class="card"><h3>🏆 Más constantes del mes</h3>' + lista(a.top, function (x) { return '<li><span>' + esc(x.nombre) + '</span><b>' + x.veces + ' días</b></li>'; }, 'Sin asistencias') + '</div>' +
    '</div>';
  $('iContenido').innerHTML = h;
}

/* =====================================================================
 *  RUTINAS (ADMIN / ENTRENADOR)
 * ===================================================================== */
async function cargarRutinas() {
  $('rUrlSocio').value = S.urlSocio;
  var l = await conCarga(api('listarRutinas'));
  if (!l) return;
  S.rutinasFull = l;
  renderListaRutinas();
  var actual = $('rId').value && l.filter(function (r) { return r.id === $('rId').value; })[0];
  if (actual) editarRutina(actual.id);
  else if (!$('rNombre').value && !S.filas.length) { if (l.length) editarRutina(l[0].id); else nuevaRutina(); }
}

function renderListaRutinas() {
  var sel = $('rId').value;
  $('rLista').innerHTML = S.rutinasFull.length ? S.rutinasFull.map(function (r) {
    return '<div class="rut-item' + (r.activo ? '' : ' inactiva') + (r.id === sel ? ' sel' : '') + '" onclick="editarRutina(\'' + esc(r.id) + '\')">' +
      '<b>' + esc(r.nombre) + '</b>' + (r.activo ? '' : ' <span class="badge gris">Oculta</span>') +
      '<div class="muted">' + esc([r.objetivo, r.nivel, r.dias + ' día(s)', r.ejercicios.length + ' ejercicios'].filter(String).join(' · ')) + '</div>' +
      '<div class="muted">👥 ' + r.asignados + ' socio(s) con esta rutina</div></div>';
  }).join('') : '<p class="muted">Aún no hay rutinas.</p>';
}

function editarRutina(id) {
  var r = S.rutinasFull.filter(function (x) { return x.id === id; })[0];
  if (!r) return;
  $('rId').value = r.id; $('rTitulo').textContent = 'Editar: ' + r.nombre;
  $('rNombre').value = r.nombre; $('rObjetivo').value = r.objetivo; $('rNivel').value = r.nivel || 'Todos';
  $('rDesc').value = r.descripcion; $('rActivo').checked = r.activo;
  S.filas = r.ejercicios.map(function (e) { return { dia: e.dia, ejercicio: e.ejercicio, series: e.series, reps: e.reps, descanso: e.descanso, notas: e.notas, video: e.video, animacion: e.animacion || '' }; });
  renderFilasEj();
  renderListaRutinas();
}

function nuevaRutina() {
  $('rId').value = ''; $('rTitulo').textContent = 'Nueva rutina';
  ['rNombre', 'rObjetivo', 'rDesc'].forEach(function (id) { $(id).value = ''; });
  $('rNivel').value = 'Principiante'; $('rActivo').checked = true;
  S.filas = [{ dia: 1, ejercicio: '', series: '3', reps: '12', descanso: '60s', notas: '', video: '', animacion: '' }];
  renderFilasEj();
  renderListaRutinas();
  $('rNombre').focus();
}

function duplicarRutina() {
  if (!$('rNombre').value) return;
  $('rId').value = ''; $('rNombre').value += ' (copia)'; $('rTitulo').textContent = 'Nueva rutina (copia)';
  renderListaRutinas();
  toast('Copia lista: ajústela y guarde');
}

function renderFilasEj() {
  var campos = [['dia', 'Día', 'c-dia'], ['ejercicio', 'Ejercicio', 'c-ej'], ['series', 'Series', 'c-num'], ['reps', 'Reps', 'c-num'], ['descanso', 'Descanso', 'c-num'], ['notas', 'Notas', ''], ['video', 'Video', '']];
  var ant = null;
  var cat = Anim.lista();
  $('rEjercicios').innerHTML = '<thead><tr>' + campos.map(function (c) { return '<th>' + c[1] + '</th>'; }).join('') + '<th>Animación</th><th></th></tr></thead><tbody>' +
    S.filas.map(function (f, i) {
      var sep = ant !== null && Number(f.dia) !== ant; ant = Number(f.dia);
      return '<tr class="' + (sep ? 'dia-sep' : '') + '">' + campos.map(function (c) {
        return '<td class="' + c[2] + '"><input data-i="' + i + '" data-k="' + c[0] + '" value="' + esc(f[c[0]]) + '"' + (c[0] === 'dia' ? ' inputmode="numeric"' : '') + '></td>';
      }).join('') +
        '<td><select data-i="' + i + '" data-k="animacion">' + opcionesAnim(f, cat) + '</select></td>' +
        '<td><button class="btn btn-light btn-sm" title="Quitar" onclick="quitarFilaEj(' + i + ')">✕</button></td></tr>';
    }).join('') + '</tbody>';
  $('rEjercicios').querySelectorAll('input, select').forEach(function (inp) {
    var i = Number(inp.dataset.i);
    var upd = function () {
      S.filas[i][inp.dataset.k] = inp.value;
      if (inp.dataset.k === 'ejercicio') {
        var sel = $('rEjercicios').querySelector('select[data-i="' + i + '"]');
        if (sel) sel.innerHTML = opcionesAnim(S.filas[i], cat);
      }
      previaAnim(i);
    };
    inp.oninput = upd; inp.onchange = upd;
    inp.onfocus = function () { previaAnim(i); };
  });
  $('rPrev').innerHTML = '';
  $('rPrevNom').textContent = 'Vista previa';
  $('rPrevTip').textContent = 'Haga clic en un ejercicio para ver su animación.';
}

function opcionesAnim(f, cat) {
  var auto = Anim.buscar(f.ejercicio, '');
  return '<option value="">Automática' + (auto ? ' (' + esc(auto.nombre) + ')' : ' (ninguna)') + '</option>' +
    cat.map(function (a) { return '<option value="' + a.id + '"' + (f.animacion === a.id ? ' selected' : '') + '>' + esc(a.nombre) + '</option>'; }).join('') +
    '<option value="-"' + (f.animacion === '-' ? ' selected' : '') + '>Sin animación</option>';
}

function previaAnim(i) {
  var f = S.filas[i];
  if (!f) return;
  var def = Anim.montar($('rPrev'), f.ejercicio, f.animacion);
  $('rPrevNom').textContent = f.ejercicio || 'Vista previa';
  $('rPrevTip').textContent = def ? def.tip : 'Sin animación para este nombre. Elija una en la columna "Animación".';
}

function agregarFilaEj(nuevoDia) {
  var max = S.filas.reduce(function (m, f) { return Math.max(m, parseInt(f.dia, 10) || 1); }, 0) || 1;
  var dia = nuevoDia ? max + (S.filas.length ? 1 : 0) : (S.filas.length ? parseInt(S.filas[S.filas.length - 1].dia, 10) || max : 1);
  S.filas.push({ dia: dia, ejercicio: '', series: '3', reps: '12', descanso: '60s', notas: '', video: '', animacion: '' });
  ordenarFilas();
  renderFilasEj();
  var vacios = $('rEjercicios').querySelectorAll('td.c-ej input');
  for (var i = vacios.length - 1; i >= 0; i--) { if (!vacios[i].value) { vacios[i].focus(); break; } }
}

function quitarFilaEj(i) { S.filas.splice(i, 1); renderFilasEj(); }

function ordenarFilas() {
  S.filas = S.filas.map(function (f, i) { return { f: f, i: i }; })
    .sort(function (a, b) { return ((parseInt(a.f.dia, 10) || 1) - (parseInt(b.f.dia, 10) || 1)) || (a.i - b.i); })
    .map(function (x) { return x.f; });
}

async function guardarRutina() {
  ordenarFilas();
  var nombre = $('rNombre').value.trim();
  var r = {
    id: $('rId').value, nombre: nombre, objetivo: $('rObjetivo').value, nivel: $('rNivel').value,
    descripcion: $('rDesc').value, activo: $('rActivo').checked, ejercicios: S.filas
  };
  var l = await conCarga(api('guardarRutina', r));
  if (!l) return;
  S.rutinasFull = l;
  S.rutinas = l.filter(function (x) { return x.activo; }).map(function (x) { return { id: x.id, nombre: x.nombre }; });
  llenarSelectRutinas();
  var guardada = r.id ? l.filter(function (x) { return x.id === r.id; })[0]
    : l.filter(function (x) { return x.nombre === nombre; }).sort(function (a, b) { return a.id < b.id ? 1 : -1; })[0];
  toast('Rutina guardada', 'ok');
  if (guardada) editarRutina(guardada.id); else renderListaRutinas();
}

function copiarLinkSocio() {
  var i = $('rUrlSocio'); i.select();
  try { navigator.clipboard.writeText(i.value).then(function () { toast('Enlace copiado', 'ok'); }, function () { document.execCommand('copy'); toast('Enlace copiado', 'ok'); }); }
  catch (e) { document.execCommand('copy'); toast('Enlace copiado', 'ok'); }
}
</script>
