<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    :root { --am:#FFC000; --fondo:#0b0b0b; --card:#161616; --card2:#1f1f1f; --borde:#2b2b2b; --txt:#f2f2f2; --sub:#a3a3a3; --ok:#22c55e; --mal:#ef4444; --med:#facc15; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; background:var(--fondo); color:var(--txt); font-family:'Segoe UI', Roboto, Arial, sans-serif; font-size:15px; }
    .hidden { display:none !important; }
    h2 { font-size:19px; margin:0 0 10px; } h3 { font-size:16px; margin:0 0 10px; }
    small, .sub { color:var(--sub); }
    input, select, textarea { width:100%; padding:12px; border-radius:10px; border:1px solid var(--borde); background:#0f0f0f; color:var(--txt); font-size:16px; font-family:inherit; }
    input:focus, select:focus { outline:2px solid var(--am); border-color:transparent; }
    label { display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--sub); font-weight:600; }
    .btn { border:0; border-radius:12px; padding:13px 16px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit; }
    .btn-am { background:var(--am); color:#000; }
    .btn-os { background:var(--card2); color:var(--txt); border:1px solid var(--borde); }
    .btn-sm { padding:8px 12px; font-size:13px; border-radius:9px; }
    .w100 { width:100%; }
    .btn:active { transform:scale(.98); }

    /* Login */
    .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-box { width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; }
    .marca { background:var(--am); color:#000; font-weight:900; font-size:30px; letter-spacing:2px; text-align:center; padding:14px; border-radius:14px; }
    .recordar { flex-direction:row; align-items:center; gap:8px; font-weight:600; }
    .recordar input { width:20px; height:20px; accent-color:var(--am); }
    .marca small { display:block; color:#000; font-size:13px; letter-spacing:1px; font-weight:700; }

    /* App */
    header { position:sticky; top:0; z-index:10; background:rgba(11,11,11,.94); backdrop-filter:blur(6px); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--borde); }
    header b { color:var(--am); letter-spacing:1px; }
    main { padding:14px 16px 170px; max-width:720px; margin:0 auto; }
    nav.abajo { position:fixed; bottom:0; left:0; right:0; z-index:10; display:grid; grid-template-columns:repeat(4,1fr); background:#111; border-top:1px solid var(--borde); padding-bottom:env(safe-area-inset-bottom); }
    nav.abajo button { background:none; border:0; color:var(--sub); padding:10px 4px 12px; font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:inherit; }
    nav.abajo button span { font-size:21px; }
    nav.abajo button.activo { color:var(--am); }
    .card { background:var(--card); border:1px solid var(--borde); border-radius:16px; padding:14px; margin-bottom:12px; }
    .fila { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .entre { justify-content:space-between; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
    .kpi { background:var(--card); border:1px solid var(--borde); border-radius:14px; padding:12px; }
    .kpi .t { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); font-weight:700; }
    .kpi .v { font-size:24px; font-weight:900; margin-top:2px; }
    .kpi .s { font-size:12px; color:var(--sub); }
    .verde-t { color:var(--ok); } .rojo-t { color:var(--mal); }
    .chip { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800; }
    .chip.verde { background:rgba(34,197,94,.15); color:var(--ok); }
    .chip.amarillo { background:rgba(250,204,21,.15); color:var(--med); }
    .chip.rojo, .chip.vencido { background:rgba(239,68,68,.15); color:var(--mal); }
    .chip.gris { background:#2a2a2a; color:var(--sub); }

    /* Rutina */
    .dias { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin:4px 0 12px; }
    .dias button { flex:0 0 auto; background:var(--card2); color:var(--txt); border:1px solid var(--borde); border-radius:999px; padding:9px 16px; font-weight:800; cursor:pointer; font-family:inherit; font-size:14px; }
    .dias button.activo { background:var(--am); color:#000; border-color:var(--am); }
    .ej { background:var(--card); border:1px solid var(--borde); border-radius:16px; padding:12px; margin-bottom:10px; transition:border-color .15s; }
    .ej.hecho { border-color:var(--am); }
    .ej-top { display:flex; gap:12px; align-items:flex-start; }
    .ej-top .nombre { font-weight:800; font-size:16px; }
    .chk { position:relative; width:30px; height:30px; flex:0 0 30px; }
    .chk input { position:absolute; opacity:0; inset:0; width:30px; height:30px; margin:0; cursor:pointer; }
    .chk i { position:absolute; inset:0; border:2px solid #555; border-radius:9px; pointer-events:none; }
    .chk input:checked + i { background:var(--am); border-color:var(--am); }
    .chk input:checked + i::after { content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#000; font-weight:900; font-style:normal; font-size:18px; }
    .ej .meta { font-size:13px; color:var(--sub); margin-top:2px; }
    .ej .nota { font-size:13px; color:#d4d4d4; margin-top:6px; }
    .ej .ultimo { font-size:12px; color:var(--am); margin-top:6px; font-weight:700; }
    .ej .hoy { font-size:12px; color:var(--ok); margin-top:4px; font-weight:700; }
    .ej .grid3 { margin-top:10px; }
    .ej .grid3 input { padding:10px; text-align:center; font-weight:700; }
    .ej a { color:var(--am); font-size:13px; font-weight:700; }
    .ej-anim { width:112px; height:95px; flex:0 0 112px; cursor:pointer; border:1px solid var(--borde); }
    .ej-anim::after { content:'⤢'; position:absolute; right:4px; bottom:1px; font-size:12px; color:var(--sub); }
    .anim-grande { width:100%; aspect-ratio:160/136; }
    .barra-guardar { position:fixed; left:0; right:0; bottom:66px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--fondo) 35%); z-index:9; }
    .barra-guardar .btn { max-width:688px; margin:0 auto; display:block; width:100%; box-shadow:0 6px 20px rgba(0,0,0,.5); }
    .rut { border:1px solid var(--borde); border-radius:14px; padding:12px; margin-bottom:10px; background:var(--card2); }
    .rut b { font-size:16px; }

    /* Historial / perfil */
    .ses { border-left:3px solid var(--am); padding:4px 0 4px 12px; margin-bottom:14px; }
    .ses .f { font-weight:800; }
    .ses ul { list-style:none; padding:0; margin:6px 0 0; font-size:14px; }
    .ses li { padding:3px 0; color:#ddd; }
    .foto { width:92px; height:92px; border-radius:50%; object-fit:cover; border:3px solid var(--am); background:#222; display:flex; align-items:center; justify-content:center; font-size:40px; }

    /* Modal, loader, toast */
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; }
    .modal-box { background:var(--card); border:1px solid var(--borde); border-radius:18px; padding:18px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; }
    .loader { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; display:flex; align-items:center; justify-content:center; }
    .spin { width:46px; height:46px; border:5px solid #333; border-top-color:var(--am); border-radius:50%; animation:g .8s linear infinite; }
    @keyframes g { to { transform:rotate(360deg); } }
    .toast { position:fixed; top:14px; left:50%; transform:translate(-50%, -140%); background:#222; color:#fff; padding:12px 16px; border-radius:12px; z-index:200; transition:transform .25s; font-weight:700; max-width:92vw; text-align:center; border:1px solid var(--borde); }
    .toast.show { transform:translate(-50%, 0); }
    .toast.ok { background:#14532d; border-color:#166534; } .toast.err { background:#7f1d1d; border-color:#991b1b; }
  </style>
  <?!= include('Api'); ?>
  <?!= include('Grafica'); ?>
  <?!= include('Animaciones'); ?>
  <?!= include('AnimCatalogo'); ?>
</head>
<body class="tema-oscuro">
  <div id="loader" class="loader hidden"><div class="spin"></div></div>
  <div id="toast" class="toast"></div>

  <!-- LOGIN -->
  <section id="vLogin" class="login">
    <div class="login-box">
      <div class="marca"><span id="lgGym">MI GIMNASIO</span><small>APP DE SOCIOS</small></div>
      <label>Cédula<input id="lgCed" inputmode="numeric" autocomplete="username"></label>
      <label>PIN<input id="lgPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>
      <button class="btn btn-am w100" onclick="entrar()">Entrar</button>
      <label class="recordar"><input type="checkbox" id="lgRecordar" checked> Mantener la sesión en este celular (30 días)</label>
      <small style="text-align:center">¿No tiene PIN o lo olvidó? Pídalo en recepción: le darán un PIN temporal.</small>
    </div>
  </section>

  <!-- APP -->
  <div id="vApp" class="hidden">
    <header><b id="hdGym"></b><span class="sub" id="hdHola"></span></header>
    <main>
      <section id="t-rutina"></section>
      <section id="t-progreso" class="hidden"></section>
      <section id="t-historial" class="hidden"></section>
      <section id="t-perfil" class="hidden"></section>
    </main>
    <div id="barraGuardar" class="barra-guardar hidden"><button class="btn btn-am" id="btnGuardar" onclick="guardarEntreno()">Guardar entrenamiento</button></div>
    <nav class="abajo">
      <button data-t="rutina" class="activo"><span>🏋️</span>Rutina</button>
      <button data-t="progreso"><span>📈</span>Progreso</button>
      <button data-t="historial"><span>🗓️</span>Historial</button>
      <button data-t="perfil"><span>👤</span>Perfil</button>
    </nav>
  </div>

  <!-- MODAL ANIMACIÓN -->
  <div id="mAnim" class="modal hidden" onclick="if(event.target===this)cerrarAnim()">
    <div class="modal-box">
      <div class="fila entre"><h3 id="mAnimTit" style="margin:0"></h3><button class="btn btn-os btn-sm" onclick="cerrarAnim()">✕</button></div>
      <div id="mAnimFig" class="anim-grande"></div>
      <div id="mAnimMeta" class="sub"></div>
      <div id="mAnimTip" style="font-size:15px;line-height:1.4"></div>
      <div id="mAnimVideo"></div>
    </div>
  </div>

  <!-- MODAL PIN -->
  <div id="mPin" class="modal hidden">
    <div class="modal-box">
      <h3 id="mPinTit">Cree su PIN personal</h3>
      <small id="mPinTxt">Elija 6 números que solo usted conozca. No use secuencias (123456), números repetidos (111111), su fecha de nacimiento ni parte de su cédula o celular.</small>
      <label>Nuevo PIN<input id="pin1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
      <label>Repita el PIN<input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
      <button class="btn btn-am" onclick="guardarPin()">Guardar PIN</button>
      <button class="btn btn-os hidden" id="mPinCerrar" onclick="$('mPin').classList.add('hidden')">Cancelar</button>
    </div>
  </div>

  <?!= include('SocioJS'); ?>
</body>
</html>
